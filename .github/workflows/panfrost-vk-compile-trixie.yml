name: Debian Trixie Build

# Build panfrost_vk_compile inside a Debian 13 (trixie) container.  Unlike the
# bookworm workflow, trixie ships new enough native packages, so no external
# apt.llvm.org / rustup / SPIRV-Tools source build is needed:
#   * spirv-tools 2025.1 (native)
#   * rustc / cargo 1.85.1 (native, satisfies Mesa's rustc >= 1.85)
#   * llvm + clang 19 (native, satisfies the CLC path's LLVM >= 15)
# Only bindgen-cli 0.71.1 is still installed via cargo (distros don't ship the
# exact version Mesa requires).
#
# Two variants are built:
#   * stable : the C Bifrost/Valhall backend only (no Rust, no bindgen).
#   * kraid  : the Rust Kraid backend compiled in and used by default.

on:
  push:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile-trixie.yml'
  pull_request:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile-trixie.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build panfrost_vk_compile (${{ matrix.variant }}, debian:trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            panfrost_rust: false
          - variant: kraid
            panfrost_rust: true
    steps:
    - name: Install base tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl gnupg git

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies (native LLVM 19, SPIRV-Tools 2025.1, rustc 1.85.1)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential pkg-config bison flex libdrm-dev libelf-dev \
          python3 python3-pip python3-venv \
          spirv-tools spirv-headers glslang-tools \
          llvm-19-dev libclang-19-dev libclc-19-dev libllvmspirvlib-19-dev \
          rustc cargo xz-utils
        # Newer meson/ninja than trixie's distro packages (usually fine, but
        # pin to be safe and to get mako).
        pip install --break-system-packages meson ninja mako

    - name: Install bindgen 0.71.1
      if: matrix.panfrost_rust
      run: |
        # Mesa requires bindgen >= 0.71.1; 0.72.0 and 0.73.x are blacklisted.
        # Native cargo installs to $CARGO_HOME/bin (default ~/.cargo/bin), which
        # is not on PATH in the container, so add it for this and later steps.
        CARGO_BIN="${CARGO_HOME:-$HOME/.cargo}/bin"
        cargo install bindgen-cli --version 0.71.1 --locked
        export PATH="$CARGO_BIN:$PATH"
        echo "$CARGO_BIN" >> "$GITHUB_PATH"
        bindgen --version

    - name: Configure
      env:
        LLVM_CONFIG: /usr/bin/llvm-config-19
      run: |
        meson setup build . \
          -Dbuildtype=release \
          -Dplatforms= \
          -Dglx=disabled \
          -Degl=disabled \
          -Dgallium-drivers= \
          -Dvulkan-drivers=panfrost \
          -Dprecomp-compiler=enabled \
          -Dpanfrost-rust=${{ matrix.panfrost_rust }} \
          -Dllvm=enabled

    - name: Build panfrost_vk_compile
      run: |
        ninja -C build src/panfrost/clc/panfrost_vk_compile

    - name: Smoke test
      run: |
        BIN=build/src/panfrost/clc/panfrost_vk_compile
        test -x "$BIN"

        export RUST_BACKTRACE=1

        # With no arguments the tool must print usage and exit non-zero.
        if "$BIN"; then
          echo "expected panfrost_vk_compile to fail without arguments" >&2
          exit 1
        fi

        cat > comp.comp <<'EOF'
        #version 450
        layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;
        layout(set = 0, binding = 0) buffer Data { float values[]; };
        void main() {
            uint i = gl_GlobalInvocationID.x;
            values[i] = values[i] * 2.0 + 1.0;
        }
        EOF
        glslangValidator -S comp -V comp.comp -o comp.spv
        "$BIN" --kraid comp.spv comp_kraid.bin
        test -s comp_kraid.bin
        "$BIN" --no-kraid comp.spv comp_bi.bin
        test -s comp_bi.bin

        cat > vert.vert <<'EOF'
        #version 450
        layout(location = 0) in vec4 a_pos;
        void main() {
            gl_Position = a_pos;
        }
        EOF
        glslangValidator -S vert -V vert.vert -o vert.spv
        "$BIN" --kraid vert.spv vert_kraid.bin
        test -s vert_kraid.bin

        # Run the compiler over a random sample of real SPIR-V shaders
        # (predownloaded/sample_shaders.tar.xz, sampled from spirv.tar.xz).
        # Individual shaders may hit unsupported ops (e.g. f2f64); count
        # failures instead of aborting so we get a full picture.
        tar -xf predownloaded/sample_shaders.tar.xz -C /tmp
        pass=0; fail=0
        for spv in /tmp/spirv_samples/*.spv; do
          if "$BIN" "$spv" /tmp/sample_out.bin >/dev/null 2>&1 && test -s /tmp/sample_out.bin; then
            pass=$((pass + 1))
          else
            fail=$((fail + 1))
          fi
        done
        echo "sample shaders: $pass passed, $fail failed (of $((pass + fail)))"

    - name: Stage artifacts
      if: always()
      run: |
        mkdir -p stage
        cp build/src/panfrost/clc/panfrost_vk_compile stage/
        cp build/src/panfrost/clc/libpanfrost_vk_compile.a stage/
        cp src/panfrost/clc/panfrost_vk_compile.h stage/
        ls -l stage

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: panfrost_vk_compile-trixie-${{ matrix.variant }}
        path: stage/
        retention-days: 5

  # Publish a GitHub release on manual workflow runs only. The Linux epoch in
  # the tag guarantees uniqueness, so re-runs never collide. Both matrix
  # variants are attached with distinct asset names.
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout (for comp_rep_minimal.spv)
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Prepare release metadata
      id: rel
      run: |
        DATE="$(date -u +%Y%m%d)"
        COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
        EPOCH="$(date -u +%s)"
        TAG="panfrost-vk-compile-trixie-${DATE}-${COMMIT}-${EPOCH}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

    - name: Flatten variant artifacts
      run: |
        mkdir -p out
        for d in dist/*/; do
          variant="$(basename "$d")"
          variant="${variant#panfrost_vk_compile-trixie-}"
          cp "$d/panfrost_vk_compile"       "out/panfrost_vk_compile-trixie-${variant}"
          cp "$d/libpanfrost_vk_compile.a"  "out/libpanfrost_vk_compile-trixie-${variant}.a"
          cp "$d/panfrost_vk_compile.h"     "out/panfrost_vk_compile-trixie-${variant}.h"
        done
        # Separate static-library bundle (.a + .h for every variant).
        mkdir -p static-libs
        cp out/libpanfrost_vk_compile-trixie-*.a static-libs/
        cp out/panfrost_vk_compile-trixie-*.h static-libs/
        tar -cJf out/panfrost_vk_compile-static-libs-trixie.tar.xz -C static-libs .
        ls -l out

    - name: Capture help + disasm for release notes
      run: |
        BIN=out/panfrost_vk_compile-trixie-kraid
        test -x "$BIN" || BIN=out/panfrost_vk_compile-trixie-stable
        "$BIN" -h > help.txt 2>&1 || true
        "$BIN" --kraid --disasm comp_rep_minimal.spv test.bin > disasm.txt 2>&1 || true
        {
          echo
          echo "### \`panfrost_vk_compile -h\`"
          echo '```'
          cat help.txt
          echo '```'
          echo
          echo "### \`panfrost_vk_compile --kraid --disasm comp_rep_minimal.spv test.bin\`"
          echo '```'
          cat disasm.txt
          echo '```'
        } > notes-snippet.md
        echo "---- help.txt ----"; cat help.txt
        echo "---- disasm.txt (head) ----"; head -40 disasm.txt

    - name: Build release body
      run: |
        cat > body.md <<EOF
        Automated panfrost_vk_compile build (Debian trixie) for ${{ steps.rel.outputs.commit }}.

        Binaries: \`panfrost_vk_compile-trixie-{stable,kraid}\`
        Static libs: \`panfrost_vk_compile-static-libs-trixie.tar.xz\` (\`.a\` + \`.h\` per variant)
        EOF
        cat notes-snippet.md >> body.md

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel.outputs.tag }}
        name: Trixie panfrost_vk_compile ${{ steps.rel.outputs.date }} (${{ steps.rel.outputs.commit }})
        body_path: body.md
        files: |
          out/panfrost_vk_compile-trixie-*
          out/panfrost_vk_compile-static-libs-trixie.tar.xz
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
