name: Debian Bookworm Build

# Build panfrost_vk_compile inside a Debian 12 (bookworm) container, matching
# the airgapped bookworm sandbox.  bookworm ships LLVM 14 and rustc 1.63, but
# the CLC path requires LLVM >= 15 and Mesa's Rust/Kraid backend requires
# rustc >= 1.85 and bindgen == 0.71.1, so this installs LLVM 15 from
# apt.llvm.org and Rust + bindgen-cli 0.71.1 via rustup/cargo.
#
# Two variants are built:
#   * stable : the C Bifrost/Valhall backend only (no Rust, no bindgen).
#   * kraid  : the Rust Kraid backend compiled in and used by default.

on:
  push:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile-bookworm.yml'
  pull_request:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile-bookworm.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned airgapped bundle (debs + wheels + bindgen) produced by
  # panfrost-vk-predownloaded.yml. Update the tag when regenerating the bundle.
  PREDOWNLOADED_BUNDLE_URL: https://github.com/leegao/mesa-upstream/releases/download/bookworm-bundle-20261127-b48ae2e-1795752866/predownloaded-bookworm.tar.xz

jobs:
  build:
    name: Build panfrost_vk_compile (${{ matrix.variant }}, debian:bookworm)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            panfrost_rust: false
          - variant: kraid
            panfrost_rust: true
    steps:
    - name: Install base tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl gnupg git

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies (LLVM 15)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential pkg-config bison flex libdrm-dev libelf-dev \
          python3 python3-pip python3-venv \
          spirv-headers glslang-tools xz-utils
        # bookworm only ships LLVM 14; the CLC path needs LLVM >= 15.
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-15 main" \
          > /etc/apt/sources.list.d/llvm-15.list
        apt-get update
        apt-get install -y --no-install-recommends \
          llvm-15-dev libclang-15-dev libclc-15-dev libllvmspirvlib-15-dev
        # Newer meson/ninja than bookworm's distro packages.
        pip install --break-system-packages meson ninja mako

    - name: Install Rust (>= 1.85) and bindgen 0.71.1
      if: matrix.panfrost_rust
      run: |
        # bookworm only ships rustc 1.63, while Mesa requires rustc >= 1.85.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        rustc --version
        cargo --version
        # Mesa requires bindgen >= 0.71.1; 0.72.0 and 0.73.x are blacklisted.
        cargo install bindgen-cli --version 0.71.1 --locked
        bindgen --version

    - name: Fetch prebuilt SPIRV-Tools 2024.1 from bundle
      run: |
        # bookworm ships SPIRV-Tools 2023.1; Mesa's CLC path needs >= 2024.1.
        # Instead of rebuilding from source (a major bottleneck), grab the
        # prebuilt .deb from the airgapped bundle produced by
        # panfrost-vk-predownloaded.yml (via predownloaded/build-spirv-tools.sh).
        curl -fsSL "$PREDOWNLOADED_BUNDLE_URL" -o /tmp/predownloaded-bookworm.tar.xz
        tar -xf /tmp/predownloaded-bookworm.tar.xz -C /tmp
        # The bundle's debs/spirv-tools-2024_2024.1_amd64.deb is a standalone
        # SPIRV-Tools (no LLVM dep). bookworm's 2023.1 is not installed above,
        # so there are no file conflicts.
        dpkg -i /tmp/debs/spirv-tools-2024_2024.1_amd64.deb
        pkg-config --modversion SPIRV-Tools

    - name: Configure
      env:
        LLVM_CONFIG: /usr/bin/llvm-config-15
      run: |
        meson setup build . \
          -Dbuildtype=release \
          -Dplatforms= \
          -Dglx=disabled \
          -Degl=disabled \
          -Dgallium-drivers= \
          -Dvulkan-drivers=panfrost \
          -Dprecomp-compiler=enabled \
          -Dpanfrost-rust=${{ matrix.panfrost_rust }} \
          -Dllvm=enabled

    - name: Build panfrost_vk_compile
      run: |
        ninja -C build src/panfrost/clc/panfrost_vk_compile

    - name: Smoke test
      run: |
        BIN=build/src/panfrost/clc/panfrost_vk_compile
        test -x "$BIN"

        # With no arguments the tool must print usage and exit non-zero.
        if "$BIN"; then
          echo "expected panfrost_vk_compile to fail without arguments" >&2
          exit 1
        fi

        cat > comp.comp <<'EOF'
        #version 450
        layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;
        layout(set = 0, binding = 0) buffer Data { float values[]; };
        void main() {
            uint i = gl_GlobalInvocationID.x;
            values[i] = values[i] * 2.0 + 1.0;
        }
        EOF
        glslangValidator -S comp -V comp.comp -o comp.spv
        "$BIN" --kraid comp.spv comp_kraid.bin
        test -s comp_kraid.bin
        "$BIN" --no-kraid comp.spv comp_bi.bin
        test -s comp_bi.bin

        cat > vert.vert <<'EOF'
        #version 450
        layout(location = 0) in vec4 a_pos;
        void main() {
            gl_Position = a_pos;
        }
        EOF
        glslangValidator -S vert -V vert.vert -o vert.spv
        "$BIN" --kraid vert.spv vert_kraid.bin
        test -s vert_kraid.bin

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: panfrost_vk_compile-bookworm-${{ matrix.variant }}
        path: build/src/panfrost/clc/panfrost_vk_compile
        retention-days: 5

  # Publish a GitHub release on manual workflow runs only. The Linux epoch in
  # the tag guarantees uniqueness, so re-runs never collide. Both matrix
  # variants are attached with distinct asset names.
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Prepare release metadata
      id: rel
      run: |
        DATE="$(date -u +%Y%m%d)"
        COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
        EPOCH="$(date -u +%s)"
        TAG="panfrost-vk-compile-bookworm-${DATE}-${COMMIT}-${EPOCH}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

    - name: Flatten variant binaries
      run: |
        # download-artifact nests each matrix artifact in its own directory and
        # both are named `panfrost_vk_compile`; copy them out under unique names.
        mkdir -p out
        for d in dist/*/; do
          variant="$(basename "$d")"
          variant="${variant#panfrost_vk_compile-bookworm-}"
          cp "$d/panfrost_vk_compile" "out/panfrost_vk_compile-bookworm-${variant}"
        done
        ls -l out

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel.outputs.tag }}
        name: Bookworm bundle ${{ steps.rel.outputs.date }} (${{ steps.rel.outputs.commit }})
        body: Automated panfrost_vk_compile build (Debian bookworm) for ${{ steps.rel.outputs.commit }}.
        files: out/panfrost_vk_compile-bookworm-*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}