name: Debian Bookworm Build

# Build panfrost_vk_compile inside a Debian 12 (bookworm) container, matching
# the airgapped bookworm sandbox.  bookworm ships LLVM 14 and rustc 1.63, but
# the CLC path requires LLVM >= 15 and Mesa's Rust/Kraid backend requires
# rustc >= 1.85 and bindgen == 0.71.1, so this installs LLVM 15 from
# apt.llvm.org and Rust + bindgen-cli 0.71.1 via rustup/cargo.
#
# Two variants are built:
#   * stable : the C Bifrost/Valhall backend only (no Rust, no bindgen).
#   * kraid  : the Rust Kraid backend compiled in and used by default.

on:
  push:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile-bookworm.yml'
  pull_request:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile-bookworm.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Split-out rustc + bindgen tarball (pinned tag) for the rust-kraid variant.
  # Update the tag when regenerating the bundle.
  RUSTC_BINDGEN_URL: https://github.com/leegao/mesa-upstream/releases/download/bookworm-bundle-20261127-fb37da3-1795758566/rustc-bindgen.tar.xz

jobs:
  build:
    name: Build panfrost_vk_compile (${{ matrix.variant }}, debian:bookworm)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            panfrost_rust: false
          - variant: kraid
            panfrost_rust: true
    steps:
    - name: Install base tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl gnupg git

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install build dependencies (LLVM 15)
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential pkg-config bison flex libdrm-dev libelf-dev \
          python3 python3-pip python3-venv \
          spirv-headers glslang-tools xz-utils
        # bookworm only ships LLVM 14; the CLC path needs LLVM >= 15.
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-15 main" \
          > /etc/apt/sources.list.d/llvm-15.list
        apt-get update
        apt-get install -y --no-install-recommends \
          llvm-15-dev libclang-15-dev libclc-15-dev libllvmspirvlib-15-dev
        # Newer meson/ninja than bookworm's distro packages.
        pip install --break-system-packages meson ninja mako

    - name: Install Rust (>= 1.85) and bindgen from bundle
      if: matrix.panfrost_rust
      run: |
        # Use the prebuilt rustc + bindgen from the split-out rustc-bindgen
        # tarball instead of rustup + `cargo install bindgen-cli` (both slow).
        # The tarball holds a relocatable rustc-1.85.1 toolchain and bindgen.
        curl -fsSL "$RUSTC_BINDGEN_URL" -o /tmp/rustc-bindgen.tar.xz
        tar -xf /tmp/rustc-bindgen.tar.xz -C /tmp
        # rustc + cargo (relocatable toolchain)
        mkdir -p /tmp/rustc
        tar -xf /tmp/rustc-1.85.1-x86_64.tar.xz -C /tmp/rustc
        export PATH="/tmp/rustc/bin:$PATH"
        echo "/tmp/rustc/bin" >> "$GITHUB_PATH"
        # bindgen (prebuilt; Mesa requires 0.71.1, 0.72.0/0.73.x blacklisted)
        install -m 0755 /tmp/bindgen /usr/local/bin/bindgen
        rustc --version
        cargo --version
        bindgen --version

    - name: Fetch prebuilt SPIRV-Tools 2024.1 from bundle
      run: |
        # bookworm ships SPIRV-Tools 2023.1; Mesa's CLC path needs >= 2024.1.
        # Instead of rebuilding from source (a major bottleneck), reuse the
        # prebuilt .deb committed at predownloaded/spirv-tools.tar.xz (produced
        # by predownloaded/build-spirv-tools.sh).
        tar -xf predownloaded/spirv-tools.tar.xz -C /tmp
        # The tarball holds a standalone SPIRV-Tools (no LLVM dep). Use
        # --force-overwrite so it replaces bookworm's 2023.1 /usr/bin/spirv-*
        # files if that package happens to be pulled in.
        dpkg -i --force-overwrite /tmp/debs/spirv-tools-2024_2024.1_amd64.deb
        pkg-config --modversion SPIRV-Tools

    - name: Configure
      env:
        LLVM_CONFIG: /usr/bin/llvm-config-15
      run: |
        meson setup build . \
          -Dbuildtype=release \
          -Dplatforms= \
          -Dglx=disabled \
          -Degl=disabled \
          -Dgallium-drivers= \
          -Dvulkan-drivers=panfrost \
          -Dprecomp-compiler=enabled \
          -Dpanfrost-rust=${{ matrix.panfrost_rust }} \
          -Dllvm=enabled

    - name: Build panfrost_vk_compile
      run: |
        ninja -C build src/panfrost/clc/panfrost_vk_compile

    - name: Smoke test
      run: |
        BIN=build/src/panfrost/clc/panfrost_vk_compile
        test -x "$BIN"

        export RUST_BACKTRACE=1

        # With no arguments the tool must print usage and exit non-zero.
        if "$BIN"; then
          echo "expected panfrost_vk_compile to fail without arguments" >&2
          exit 1
        fi

        cat > comp.comp <<'EOF'
        #version 450
        layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;
        layout(set = 0, binding = 0) buffer Data { float values[]; };
        void main() {
            uint i = gl_GlobalInvocationID.x;
            values[i] = values[i] * 2.0 + 1.0;
        }
        EOF
        glslangValidator -S comp -V comp.comp -o comp.spv
        "$BIN" --kraid comp.spv comp_kraid.bin
        test -s comp_kraid.bin
        "$BIN" --no-kraid comp.spv comp_bi.bin
        test -s comp_bi.bin

        cat > vert.vert <<'EOF'
        #version 450
        layout(location = 0) in vec4 a_pos;
        void main() {
            gl_Position = a_pos;
        }
        EOF
        glslangValidator -S vert -V vert.vert -o vert.spv
        "$BIN" --kraid vert.spv vert_kraid.bin
        test -s vert_kraid.bin

        # Run the compiler over a random sample of real SPIR-V shaders
        # (predownloaded/sample_shaders.tar.xz, sampled from spirv.tar.xz).
        # Individual shaders may hit unsupported ops (e.g. f2f64); count
        # failures instead of aborting so we get a full picture.
        tar -xf predownloaded/sample_shaders.tar.xz -C /tmp
        pass=0; fail=0
        for spv in /tmp/spirv_samples/*.spv; do
          if "$BIN" "$spv" /tmp/sample_out.bin >/dev/null 2>&1 && test -s /tmp/sample_out.bin; then
            pass=$((pass + 1))
          else
            fail=$((fail + 1))
          fi
        done
        echo "sample shaders: $pass passed, $fail failed (of $((pass + fail)))"

    - name: Stage artifacts
      if: always()
      run: |
        mkdir -p stage
        cp build/src/panfrost/clc/panfrost_vk_compile stage/
        ARCHIVES=$(for token in $(ninja -C build -t commands src/panfrost/clc/panfrost_vk_compile | tail -n 1); do
          case "$token" in
            /*) ;;
            *.a) echo "build/$token" ;;
          esac
        done)
        ld -r --gc-sections -e panfrost_vk_compile -o stage/panfrost_vk_compile.o \
          --start-group $ARCHIVES --end-group
        objcopy --keep-global-symbol=panfrost_vk_compile stage/panfrost_vk_compile.o
        strip --strip-unneeded stage/panfrost_vk_compile.o
        ar rcs stage/libpanfrost_vk_compile.a stage/panfrost_vk_compile.o
        rm -f stage/panfrost_vk_compile.o
        cp src/panfrost/clc/panfrost_vk_compile.h stage/
        ls -l stage

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: panfrost_vk_compile-bookworm-${{ matrix.variant }}
        path: stage/
        retention-days: 5

  # Publish a GitHub release on manual workflow runs only. The Linux epoch in
  # the tag guarantees uniqueness, so re-runs never collide. Both matrix
  # variants are attached with distinct asset names.
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout (for comp_rep_minimal.spv)
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Prepare release metadata
      id: rel
      run: |
        DATE="$(date -u +%Y%m%d)"
        COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
        EPOCH="$(date -u +%s)"
        TAG="panfrost-vk-compile-bookworm-${DATE}-${COMMIT}-${EPOCH}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

    - name: Flatten variant artifacts
      run: |
        mkdir -p out
        for d in dist/*/; do
          variant="$(basename "$d")"
          variant="${variant#panfrost_vk_compile-bookworm-}"
          cp "$d/panfrost_vk_compile"       "out/panfrost_vk_compile-bookworm-${variant}"
          cp "$d/libpanfrost_vk_compile.a"  "out/libpanfrost_vk_compile-bookworm-${variant}.a"
          cp "$d/panfrost_vk_compile.h"     "out/panfrost_vk_compile-bookworm-${variant}.h"
        done
        # Separate static-library bundle (.a + .h for every variant).
        mkdir -p static-libs
        cp out/libpanfrost_vk_compile-bookworm-*.a static-libs/
        cp out/panfrost_vk_compile-bookworm-*.h static-libs/
        tar -cJf out/panfrost_vk_compile-static-libs-bookworm.tar.xz -C static-libs .
        ls -l out

    - name: Capture help + disasm for release notes
      run: |
        BIN=out/panfrost_vk_compile-bookworm-kraid
        test -x "$BIN" || BIN=out/panfrost_vk_compile-bookworm-stable
        "$BIN" -h > help.txt 2>&1 || true
        "$BIN" --kraid --disasm comp_rep_minimal.spv test.bin > disasm.txt 2>&1 || true
        {
          echo
          echo "### \`panfrost_vk_compile -h\`"
          echo '```'
          cat help.txt
          echo '```'
          echo
          echo "### \`panfrost_vk_compile --kraid --disasm comp_rep_minimal.spv test.bin\`"
          echo '```'
          cat disasm.txt
          echo '```'
        } > notes-snippet.md
        echo "---- help.txt ----"; cat help.txt
        echo "---- disasm.txt (head) ----"; head -40 disasm.txt

    - name: Build release body
      run: |
        cat > body.md <<EOF
        Automated panfrost_vk_compile build (Debian bookworm) for ${{ steps.rel.outputs.commit }}.

        Binaries: \`panfrost_vk_compile-bookworm-{stable,kraid}\`
        Static libs: \`panfrost_vk_compile-static-libs-bookworm.tar.xz\` (\`.a\` + \`.h\` per variant)
        EOF
        cat notes-snippet.md >> body.md

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel.outputs.tag }}
        name: Bookworm panfrost_vk_compile ${{ steps.rel.outputs.date }} (${{ steps.rel.outputs.commit }})
        body_path: body.md
        files: |
          out/panfrost_vk_compile-bookworm-*
          out/panfrost_vk_compile-static-libs-bookworm.tar.xz
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
