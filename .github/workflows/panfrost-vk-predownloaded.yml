name: Package Bookworm Build Bundle

# Populate predownloaded/ with every Debian 12 (bookworm) build tool needed to
# build panfrost_vk_compile, inside a debian:bookworm container, and upload the
# result as an artifact.  This produces the airgapped bundle without needing a
# local container (handy when local storage is tight).

on:
  workflow_dispatch:
  push:
    paths:
      - 'predownloaded/**'
      - '.github/workflows/panfrost-vk-predownloaded.yml'

permissions:
  contents: write

jobs:
  package:
    name: Fetch bookworm packages
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
    - name: Install base tools
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl gnupg git python3 python3-pip python3-venv tar xz-utils

    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch bookworm packages (debs + wheels + bindgen)
      run: |
        cd predownloaded
        ./fetch.sh

    - name: Package the bundle
      run: |
        # Ship the populated dirs plus the install scripts so the tarball is a
        # self-contained airgapped bundle.
        # tar -czf predownloaded-bookworm.tar.gz \
        #   -C predownloaded debs wheels bin README.md install.sh
        tar -I 'xz -9 -T4 -v' -cf predownloaded-bookworm.tar.xz -C predownloaded debs wheels bin README.md install.sh sample_shaders.tar.xz

    - name: Split out spirv-tools
      run: |
        # Also publish a small spirv-tools-only tarball so CI can grab just the
        # prebuilt SPIRV-Tools without downloading the whole bundle.
        tar -I 'xz -9 -T4' -cf spirv-tools.tar.xz \
          -C predownloaded/debs spirv-tools-2024_2024.1_amd64.deb
        ls -l spirv-tools.tar.xz

    - name: Split out rustc-bindgen
      run: |
        # Also publish a small rustc + bindgen tarball so CI can grab the Rust
        # toolchain without downloading the whole bundle.
        tar -I 'xz -9 -T4' -cf rustc-bindgen.tar.xz \
          -C predownloaded/bin rustc-1.85.1-x86_64.tar.xz bindgen
        ls -l rustc-bindgen.tar.xz

    - name: Upload bundle
      uses: actions/upload-artifact@v4
      with:
        name: predownloaded-bookworm
        path: |
          predownloaded-bookworm.tar.xz
          spirv-tools.tar.xz
          rustc-bindgen.tar.xz
        retention-days: 5

    # Publish a GitHub release on every push to this branch. The Linux epoch in
    # the tag guarantees uniqueness, so re-runs never collide.
    - name: Prepare release metadata
      if: github.event_name == 'push' && github.ref == 'refs/heads/panfrost-compiler'
      id: rel
      run: |
        DATE="$(date -u +%Y%m%d)"
        COMMIT="$(echo "$GITHUB_SHA" | cut -c1-7)"
        EPOCH="$(date -u +%s)"
        TAG="bookworm-bundle-${DATE}-${COMMIT}-${EPOCH}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      if: github.event_name == 'push' && github.ref == 'refs/heads/panfrost-compiler'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel.outputs.tag }}
        name: Bookworm bundle ${{ steps.rel.outputs.date }} (${{ steps.rel.outputs.commit }})
        body: Automated predownloaded bookworm bundle for ${{ steps.rel.outputs.commit }}.
        files: |
          predownloaded-bookworm.tar.xz
          spirv-tools.tar.xz
          rustc-bindgen.tar.xz
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
