name: Panfrost Vulkan SPIR-V Compiler

# Build the standalone `panfrost_vk_compile` tool, which compiles Vulkan
# SPIR-V (Vertex / Fragment / Compute) directly to Valhall/Bifrost ISA using
# Mesa's libpanfrost_compiler + libnir + spirv_to_nir, with no DRM, X11,
# Wayland or libvulkan dependency.
#
# Two variants are built:
#   * non-rust   : the C Bifrost/Valhall backend only (no Rust, no bindgen).
#   * rust-kraid : the Rust Kraid backend compiled in and used by default
#                  (requires bindgen).  The compute smoke test is additionally
#                  run with PAN_USE_KRAID=all to exercise the Kraid path.

on:
  push:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile.yml'
  pull_request:
    paths:
      - 'src/panfrost/**'
      - 'src/compiler/**'
      - '.github/workflows/panfrost-vk-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: non-rust
            panfrost_rust: false
          - variant: rust-kraid
            panfrost_rust: true
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          llvm-21-dev \
          libclang-21-dev \
          libclc-21-dev \
          libllvmspirvlib-21-dev \
          libelf-dev \
          spirv-tools \
          spirv-tools-dev \
          bison \
          flex \
          libdrm-dev \
          glslang-tools \
          pkg-config
        python -m pip install --upgrade pip
        pip install mako PyYAML meson ninja packaging

    - name: Install bindgen (Rust variant only)
      if: matrix.panfrost_rust
      run: |
        # Mesa requires bindgen >= 0.71.1; 0.72.0 and 0.73.x are known-buggy.
        cargo install bindgen-cli --version 0.72.1 --locked

    - name: Configure
      env:
        LLVM_CONFIG: /usr/bin/llvm-config-21
      run: |
        meson setup build-panfrost-vk . \
          -Dbuildtype=release \
          -Dplatforms= \
          -Dglx=disabled \
          -Degl=disabled \
          -Dgallium-drivers= \
          -Dvulkan-drivers=panfrost \
          -Dprecomp-compiler=enabled \
          -Dpanfrost-rust=${{ matrix.panfrost_rust }} \
          -Dllvm=enabled

    - name: Build panfrost_vk_compile
      run: |
        ninja -C build-panfrost-vk src/panfrost/clc/panfrost_vk_compile -v

    - name: Smoke test
      run: |
        BIN=build-panfrost-vk/src/panfrost/clc/panfrost_vk_compile
        test -x "$BIN"

        # With no arguments the tool must print its usage and exit non-zero.
        if "$BIN"; then
          echo "expected panfrost_vk_compile to fail without arguments" >&2
          exit 1
        fi

        cat > comp.comp <<'EOF'
        #version 450
        layout(local_size_x = 8, local_size_y = 8, local_size_z = 1) in;
        layout(set = 0, binding = 0) buffer Data { float values[]; };
        void main() {
            uint i = gl_GlobalInvocationID.x;
            values[i] = values[i] * 2.0 + 1.0;
        }
        EOF
        glslangValidator -S comp -V comp.comp -o comp.spv

        # Default backend (Bifrost for non-rust; Bifrost via the tool's
        # PAN_USE_KRAID=0 default for the rust build).
        "$BIN" comp.spv comp.bin
        test -s comp.bin

        # Rust/Kraid variant: also exercise the Kraid compute path.
        if [ "${{ matrix.panfrost_rust }}" = "true" ]; then
          PAN_USE_KRAID=all "$BIN" comp.spv comp-kraid.bin
          test -s comp-kraid.bin
        fi

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: panfrost_vk_compile-${{ matrix.variant }}
        path: build-panfrost-vk/src/panfrost/clc/panfrost_vk_compile
        retention-days: 5

  # Publish a GitHub release on manual workflow runs only. The Linux epoch in
  # the tag guarantees uniqueness, so re-runs never collide. Both matrix
  # variants are attached with distinct asset names.
  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Prepare release metadata
      id: rel
      run: |
        DATE="$(date -u +%Y%m%d)"
        COMMIT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
        EPOCH="$(date -u +%s)"
        TAG="panfrost-vk-compile-${DATE}-${COMMIT}-${EPOCH}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

    - name: Flatten variant binaries
      run: |
        # download-artifact nests each matrix artifact in its own directory and
        # both are named `panfrost_vk_compile`; copy them out under unique names.
        mkdir -p out
        for d in dist/*/; do
          variant="$(basename "$d")"
          variant="${variant#panfrost_vk_compile-}"
          cp "$d/panfrost_vk_compile" "out/panfrost_vk_compile-${variant}"
        done
        ls -l out

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.rel.outputs.tag }}
        name: Panfrost VK compile ${{ steps.rel.outputs.date }} (${{ steps.rel.outputs.commit }})
        body: Automated panfrost_vk_compile build for ${{ steps.rel.outputs.commit }}.
        files: out/panfrost_vk_compile-*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
